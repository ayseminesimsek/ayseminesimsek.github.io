about: |
  I am a fourth-year Metallurgical and Materials Engineering student at Middle East Technical University (METU) in Ankara.

  Through my internships I have seen materials from two very different scales: the hot rolling of steel billets on the production floor at İSDEMİR, and the synthesis and characterization of semiconductor materials in the laboratory at METU EMUM. I am currently a student worker at RÜZGEM, the METU Center for Wind Energy.

  I am looking for further internship opportunities and for engineering projects where I can collaborate and gain practical experience. Outside the lab, I play on the METU Women's Billiards Team and enjoy tennis.

